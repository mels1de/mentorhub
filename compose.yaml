name: mentorhub

services:
  db:
    build: ./infra/postgres
    image: mentorhub/postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mentorhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentorhub}
      POSTGRES_DB: ${POSTGRES_DB:-mentorhub}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Docker's 64 MB default is too small for parallel queries and HNSW index builds.
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
