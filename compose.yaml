name: mentorhub

# Shared by every service that runs the backend image (API, migrations, worker, beat).
x-backend: &backend
  build:
    context: ./backend
    target: dev
  image: mentorhub/backend:dev
  env_file:
    - path: .env
      required: false
  # Overrides .env: inside the Compose network services are reached by name on default ports.
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
  volumes:
    - ./backend:/app

services:
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *backend
    # watchfiles restarts the worker on code changes, like uvicorn --reload does for the API.
    command:
      - watchfiles
      - --filter
      - python
      - celery -A app.worker.celery_app:celery_app worker -Q default,emails,ai --loglevel INFO
      - app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  beat:
    <<: *backend
    # Schedule state goes to /tmp so it never lands in the bind-mounted repo.
    command:
      - celery
      - -A
      - app.worker.celery_app:celery_app
      - beat
      - --schedule
      - /tmp/celerybeat-schedule
      - --loglevel
      - INFO
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  db:
    build: ./infra/postgres
    image: mentorhub/postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mentorhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentorhub}
      POSTGRES_DB: ${POSTGRES_DB:-mentorhub}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Docker's 64 MB default is too small for parallel queries and HNSW index builds.
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    # The node name (rabbit@<hostname>) keys the data dir; a random hostname loses queues on recreate.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mentorhub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mentorhub}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-15672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15673}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-mentorhub}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-mentorhub-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${S3_PORT:-19000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-19001}:9001"
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot: creates the bucket if it is missing, then exits 0.
  rustfs-init:
    image: amazon/aws-cli:2.40.3
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-mentorhub}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-mentorhub-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-mentorhub}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - aws s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null || aws s3 mb "s3://$$S3_BUCKET"
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${SMTP_PORT:-11025}:1025"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  rustfsdata:
