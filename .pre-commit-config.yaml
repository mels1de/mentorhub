# Install once: `uvx pre-commit install`. Run on everything: `uvx pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Local hooks run the versions pinned in uv.lock / package-lock.json, so they match CI.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix --force-exclude
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format --force-exclude
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
      - id: frontend-lint
        name: frontend lint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/
        pass_filenames: false
